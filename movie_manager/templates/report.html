<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影文件管理中心</title>
    <!-- Assets: bundled locally in Web-serve mode (fully offline);
         static report mode (file://) falls back to CDN. -->
    <script>
        (function () {
            var local = location.protocol !== 'file:';
            var base = local ? '/assets' : 'https://unpkg.com';
            var vue = local ? '/assets/vue.global.prod.js' : base + '/vue@3/dist/vue.global.prod.js';
            var epJs = local ? '/assets/element-plus.full.min.js' : base + '/element-plus@2/dist/index.full.min.js';
            var epCss = local ? '/assets/element-plus.css' : base + '/element-plus@2/dist/index.css';
            var icons = local ? '/assets/element-plus-icons.iife.min.js' : base + '/@element-plus/icons-vue@2/dist/index.iife.min.js';
            document.write('<link rel="stylesheet" href="' + epCss + '">');
            document.write('<script src="' + vue + '"><\/script>');
            document.write('<script src="' + epJs + '"><\/script>');
            document.write('<script src="' + icons + '"><\/script>');
        })();
    </script>
    
    <style>
        /* Custom CSS for modern look */
        :root {
            --primary-color: #409EFF;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #606266;
            --border-radius: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            margin: 0; 
            padding: 0 20px 40px; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .page-header {
            padding: 40px 0 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .page-header h1 {
            margin: 15px 0 5px;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
        }
        .page-header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 15px;
        }
        .logo-icon {
            font-size: 48px;
            color: var(--primary-color);
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
        }

        /* Cards */
        .section-card { 
            background: var(--card-bg); 
            padding: 24px 30px; 
            border-radius: var(--border-radius); 
            box-shadow: var(--shadow-sm); 
            margin-bottom: 24px; 
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .section-card:hover {
            box-shadow: var(--shadow-md);
        }

        .section-title { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid #f0f2f5; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--text-main);
        }
        .section-title .el-icon {
            margin-right: 8px;
            color: var(--primary-color);
            vertical-align: middle;
        }

        /* Links */
        .file-link { color: var(--primary-color); text-decoration: none; cursor: pointer; font-weight: 500; transition: var(--transition); display: inline-flex; align-items: center; gap: 4px; }
        .file-link:hover { opacity: 0.8; }

        /* Log Window */
        .log-window { 
            background: #1e1e1e; 
            color: #a9b7c6; 
            padding: 15px; 
            border-radius: 8px; 
            height: 120px; 
            overflow-y: auto; 
            font-family: 'Fira Code', Consolas, monospace; 
            font-size: 13px; 
            margin-top: 15px; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .log-window::-webkit-scrollbar { width: 8px; }
        .log-window::-webkit-scrollbar-track { background: #1e1e1e; }
        .log-window::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .log-entry { margin-bottom: 4px; line-height: 1.4; }

        /* Filters */
        .filter-group { 
            background-color: #f8fafc; 
            border-radius: 8px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid #ebeef5;
        }
        .filter-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-label { font-size: 14px; color: var(--text-secondary); width: 80px; font-weight: 500; }

        /* Utilities */
        .w-100 { width: 100%; }
        .flex-center { display: flex; justify-content: center; align-items: center; }
        .mt-10 { margin-top: 10px; }
        .ml-10 { margin-left: 10px; }

        /* Big Buttons */
        .scan-btn-large { 
            width: 220px; 
            height: 54px; 
            font-size: 18px; 
            border-radius: 27px; 
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 6px 16px rgba(64,158,255,0.3); 
            transition: var(--transition); 
        }
        .scan-btn-large:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(64,158,255,0.4); 
        }
        .stop-btn-large {
            height: 54px;
            border-radius: 27px;
            padding: 0 30px;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(245,108,108,0.3);
        }

        .progress-container { margin-top: 20px; margin-bottom: 20px; }

        /* Table Adjustments */
        .el-table { border-radius: 8px; overflow: hidden; }
        .el-table th.el-table__cell { background-color: #f8fafc !important; color: var(--text-main); font-weight: 600; }

        .config-actions { display: flex; gap: 10px; align-items: center; }
        .config-actions .el-upload { display: inline-flex; margin: 0; padding: 0; line-height: 1; vertical-align: middle; }
        .config-actions .el-upload .el-button { margin: 0; }

        .excluded-row { opacity: 0.5; background-color: #fafafa !important; }
        .excluded-row .el-table__cell { color: #a8abb2; text-decoration: line-through; }

        .thumb-fallback { width: 80px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #909399; background: #f5f7fa; border-radius: 4px; }

        /* 增大复选框点击区域 */
        .el-checkbox {
            padding: 6px 10px;
            margin-right: 15px;
        }
        .el-checkbox__input {
            transform: scale(1.15);
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="logo-icon">
                <el-icon><Video-Camera-Filled /></el-icon>
            </div>
            <h1>电影文件管理中心</h1>
            <p>智能扫描、重复检测与整理工具</p>
        </div>

        <!-- Hidden data for offline report mode -->
        <script id="embedded-data-files" type="application/json">[[[ files_json | default('null') ]]]</script>
        <script id="embedded-data-groups" type="application/json">[[[ groups_json | default('null') ]]]</script>
        <script id="embedded-data-versions" type="application/json">[[[ version_groups_json | default('null') ]]]</script>
        
        <!-- 1. 扫描配置 -->
        <div class="section-card">
            <div class="section-title">
                <span><el-icon><Setting /></el-icon> 扫描配置</span>
                <div class="config-actions">
                    <el-button size="small" @click="saveConfig"><el-icon><Check /></el-icon> 保存配置</el-button>
                    <el-button size="small" @click="exportConfig"><el-icon><Download /></el-icon> 导出配置</el-button>
                    <div style="display: inline-flex; align-items: center;">
                        <el-upload
                            action=""
                            :auto-upload="false"
                            :show-file-list="false"
                            :on-change="importConfig"
                            accept=".json"
                        >
                            <el-button size="small"><el-icon><Upload /></el-icon> 导入配置</el-button>
                        </el-upload>
                    </div>
                </div>
            </div>
            <el-form label-position="top">
                <el-row :gutter="20">
                    <el-col :span="16">
                        <el-form-item label="扫描路径 (每行一个)">
                            <el-input v-model="config.paths" type="textarea" :rows="3" placeholder="D:\Movies\n\\NAS\Public\Video"></el-input>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="视频扩展名 (用逗号分隔)">
                            <el-input v-model="config.extensions" placeholder=".mkv, .mp4, .avi"></el-input>
                        </el-form-item>
                        <el-form-item>
                            <div style="display: flex; flex-direction: column; gap: 5px;">
                                <el-checkbox v-model="config.ignoreHidden">忽略隐藏文件</el-checkbox>
                                <el-checkbox v-model="config.ignoreSystem">忽略回收站及系统目录</el-checkbox>
                            </div>
                        </el-form-item>
                    </el-col>
                </el-row>
            </el-form>
        </div>

        <!-- 2. 扫描控制与进度 -->
        <div class="flex-center" style="margin-bottom: 30px;">
            <el-button type="primary" class="scan-btn-large" @click="startScan" :loading="isBusy" :disabled="isBusy">
                <span v-if="!isBusy">
                    <el-icon style="margin-right: 5px; vertical-align: middle;"><Video-Play /></el-icon>
                    开始扫描
                </span>
                <span v-else>扫描中...</span>
            </el-button>
            <el-button v-if="isBusy" type="danger" class="stop-btn-large" @click="stopScan" style="margin-left: 20px;">
                <el-icon style="margin-right: 5px; vertical-align: middle;"><Video-Pause /></el-icon>
                停止
            </el-button>
        </div>

        <div class="section-card progress-container" v-if="status && (isBusy || (status.progress > 0 && status.progress < 100) || status.status === 'error')">
            <div class="section-title" v-text="'扫描进度: ' + (status.message || '...')"></div>
            <el-progress :percentage="status.progress || 0" :status="progressStatus" :text-inside="true" :stroke-width="20"></el-progress>
            <div class="log-window" ref="logWindow">
                <div v-for="(log, i) in (status.logs || [])" :key="i" class="log-entry" v-text="log"></div>
            </div>
        </div>

        <!-- 3. 所有文件列表 (含筛选) -->
        <div class="section-card" v-show="files.length > 0">
            <div class="section-title">
                <span><el-icon><List /></el-icon> 文件列表 (<span v-text="filteredFiles.length"></span> / <span v-text="files.length"></span>)</span>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <!-- TMDB Zone -->
                    <el-input v-model="config.apiKey" placeholder="TMDB API Key" style="width: 200px;" clearable></el-input>
                    <el-button type="warning" @click="startTMDB" :disabled="isBusy || filteredFiles.length === 0">
                        <el-icon><Search /></el-icon> TMDB 搜索
                    </el-button>
                    
                    <el-divider direction="vertical"></el-divider>
                    
                    <el-button type="success" @click="startMatching" :disabled="isBusy || filteredFiles.length === 0">
                        <el-icon><Connection /></el-icon> 查找重复
                    </el-button>

                    <el-divider direction="vertical"></el-divider>

                    <span style="font-size: 13px; color: #606266;">版本聚类阈值</span>
                    <el-input-number v-model="clusterThreshold" :min="50" :max="100" size="small" style="width: 100px;"></el-input-number>
                    <el-button type="primary" plain @click="startVersionClustering" :disabled="isBusy || filteredFiles.length === 0">
                        <el-icon><CopyDocument /></el-icon> 版本聚类
                    </el-button>
                </div>
            </div>

            <!-- 5个独立筛选栏 -->
            <div class="filter-group">
                <div class="filter-row">
                    <span class="filter-label">路径</span>
                    <el-select v-model="filters.path.mode" style="width: 100px;">
                        <el-option label="包含" value="include"></el-option>
                        <el-option label="不包含" value="exclude"></el-option>
                    </el-select>
                    <el-input v-model="filters.path.value" placeholder="例如: Downloads" clearable style="width: 300px;"></el-input>
                </div>

                <div class="filter-row">
                    <span class="filter-label">文件名</span>
                    <el-select v-model="filters.filename.mode" style="width: 100px;">
                        <el-option label="包含" value="include"></el-option>
                        <el-option label="不包含" value="exclude"></el-option>
                    </el-select>
                    <el-input v-model="filters.filename.value" placeholder="例如: Matrix" clearable style="width: 300px;"></el-input>
                </div>

                <div class="filter-row">
                    <span class="filter-label">扩展名</span>
                    <el-select v-model="filters.extension.mode" style="width: 100px;">
                        <el-option label="包含" value="include"></el-option>
                        <el-option label="不包含" value="exclude"></el-option>
                    </el-select>
                    <el-input v-model="filters.extension.value" placeholder="例如: .mkv" clearable style="width: 300px;"></el-input>
                </div>

                <div class="filter-row">
                    <span class="filter-label">大小 (MB)</span>
                    <el-select v-model="filters.size.mode" style="width: 100px;">
                        <el-option label="大于" value="gt"></el-option>
                        <el-option label="小于" value="lt"></el-option>
                    </el-select>
                    <el-input-number v-model="filters.size.value" :min="0" :step="100" style="width: 150px;"></el-input-number>
                </div>

                <div class="filter-row">
                    <span class="filter-label">时长 (分)</span>
                    <el-select v-model="filters.duration.mode" style="width: 100px;">
                        <el-option label="大于" value="gt"></el-option>
                        <el-option label="小于" value="lt"></el-option>
                    </el-select>
                    <el-input-number v-model="filters.duration.value" :min="0" :step="10" style="width: 150px;"></el-input-number>
                </div>

                 <el-collapse>
                    <el-collapse-item title="高级表达式 (JavaScript 语法)" name="1">
                        <el-input v-model="filters.expression" placeholder="例如: (size_mb > 1000) & (path.includes('Test'))"></el-input>
                    </el-collapse-item>
                </el-collapse>
                
                <div style="margin-top: 15px; text-align: center;">
                    <el-button type="primary" icon="Filter" @click="applyFilters" style="width: 200px;">应用筛选条件</el-button>
                </div>
            </div>

            <!-- 文件表格 -->
            <el-table :data="pagedFiles" style="width: 100%" border stripe size="small" row-key="uuid" @selection-change="handleFileSelection">
                <el-table-column type="selection" width="55" :reserve-selection="true"></el-table-column>
                <el-table-column prop="filename" label="文件名" sortable min-width="250">
                    <template #default="scope">
                        <span class="file-link" @click="openFile(scope.row.path)">
                            <el-icon><Video-Play /></el-icon> <span v-text="scope.row.filename"></span>
                        </span>
                    </template>
                </el-table-column>
                <el-table-column prop="size_mb" label="大小 (MB)" sortable width="120"></el-table-column>
                <el-table-column prop="duration" label="时长" sortable width="120">
                    <template #default="scope"><span v-text="formatDuration(scope.row.duration)"></span></template>
                </el-table-column>
                <el-table-column prop="path" label="路径" min-width="300">
                    <template #default="scope">
                        <span class="file-link" @click="revealFile(scope.row.path)" v-text="scope.row.path"></span>
                    </template>
                </el-table-column>
            </el-table>
            
            <el-pagination
                background
                layout="prev, pager, next, sizes, total"
                :total="filteredFiles.length"
                v-model:current-page="currentPage"
                v-model:page-size="pageSize"
                :page-sizes="[10, 50, 100, 500]"
                class="mt-10"
                style="justify-content: center;"
            ></el-pagination>
        </div>

        <!-- 4. 重复文件列表 -->
        <div class="section-card" v-show="suspectedGroups.length > 0">
            <div class="section-title">
                <span><el-icon><Files /></el-icon> 疑似重复分组 (<span v-text="suspectedGroups.length"></span> 组)</span>
                <div style="display: flex; gap: 10px; align-items: center;">
                     <el-tag size="small" type="info">已展开 <span v-text="expandedSuspectedCount"></span>/<span v-text="suspectedGroups.length"></span></el-tag>
                     <el-button-group>
                        <el-button size="small" :disabled="suspectedGroups.length === 0" @click="expandAllSuspectedGroups">
                            <el-icon><ArrowDown /></el-icon> 展开全部
                        </el-button>
                        <el-button size="small" :disabled="suspectedGroups.length === 0" @click="collapseAllSuspectedGroups">
                            <el-icon><ArrowUp /></el-icon> 折叠全部
                        </el-button>
                    </el-button-group>
                     <el-button type="primary" size="small" :disabled="selectedSuspectedGroupIds.length === 0" @click="batchVerifySelected">
                        <el-icon><Cpu /></el-icon> 批量验证Hash选中 (<span v-text="selectedSuspectedGroupIds.length"></span>)
                    </el-button>
                    <el-button type="danger" size="small" :disabled="globalSelectedUuids.length === 0" @click="globalBatchDelete">
                        <el-icon><Delete /></el-icon> 删除全部选中文件 (<span v-text="globalSelectedUuids.length"></span>)
                    </el-button>
                </div>
            </div>
            
            <el-table ref="suspectedGroupsTableRef" :data="suspectedGroups" style="width: 100%" border stripe size="small" row-key="id" :expand-row-keys="expandedSuspectedGroupIds" :default-sort="{prop: 'total_size', order: 'descending'}" @selection-change="handleSuspectedSelectionChange" @expand-change="handleSuspectedExpandChange">
                <el-table-column type="selection" width="55" :reserve-selection="true"></el-table-column>
                <el-table-column type="expand">
                    <template #default="props">
                        <!-- Nested table for group files -->
                        <div style="padding: 16px; background: #fdf6ec; border-radius: 8px; margin: 8px;">
                            <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                                 <div>
                                    <span style="font-weight: bold;">匹配原因:</span>
                                    <el-tag v-for="r in (props.row.reasons || [])" :key="r" size="small" :type="reasonTagType(r)" style="margin-left: 5px;" v-text="reasonLabel(r)"></el-tag>
                                 </div>
                                 <div>
                                    <el-button type="primary" size="small" @click="startDeepVerify(props.row.id)" v-if="props.row.status !== 'confirmed'"><el-icon><Cpu /></el-icon> 验证Hash</el-button>
                                    <el-button type="info" size="small" :disabled="selectedInGroup(props.row.id).length === 0" @click="batchExclude(props.row.id)">
                                        <el-icon><Remove /></el-icon> 排除选中 (<span v-text="selectedInGroup(props.row.id).length"></span>)
                                    </el-button>
                                    <el-button type="danger" size="small" :disabled="selectedInGroup(props.row.id).length === 0" @click="batchDelete(props.row.id)">
                                        <el-icon><Delete /></el-icon> 删除选中 (<span v-text="selectedInGroup(props.row.id).length"></span>)
                                    </el-button>
                                 </div>
                            </div>
                            
                            <el-table :ref="(el) => setNestedTableRef(props.row.id, el)" :data="props.row.files" border size="small" row-key="uuid" @selection-change="(val) => handleSelectionChange(props.row.id, val)" :row-class-name="tableRowClassName">
                                <el-table-column type="selection" width="55" :reserve-selection="true"></el-table-column>
                                <el-table-column label="预览" width="90">
                                     <template #default="scope">
                                        <el-image v-if="isServeMode" :src="'/api/thumb/' + scope.row.uuid" style="width:80px;height:45px" fit="cover" lazy>
                                            <template #error><div class="thumb-fallback">无预览</div></template>
                                        </el-image>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="filename" label="文件名" min-width="250">
                                     <template #default="scope">
                                        <span class="file-link" @click="openFile(scope.row.path)" v-text="scope.row.filename"></span>
                                        <el-tag v-if="scope.row.excluded" size="small" type="info" style="margin-left: 5px;">已排除</el-tag>
                                    </template>
                                </el-table-column>
                                <el-table-column label="匹配详情" width="150">
                                     <template #default="scope">
                                        <el-tag v-for="r in (scope.row.match_reason || [])" :key="r" size="small" :type="reasonTagType(r)" style="margin-right:2px" v-text="reasonLabel(r)"></el-tag>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="size_mb" label="大小(MB)" width="100"></el-table-column>
                                 <el-table-column prop="duration" label="时长" width="100">
                                    <template #default="scope"><span v-text="formatDuration(scope.row.duration)"></span></template>
                                </el-table-column>
                                <el-table-column prop="path" label="路径"></el-table-column>
                                <el-table-column width="210" label="操作">
                                     <template #default="scope">
                                        <el-button type="danger" size="small" @click="deleteFile(scope.row.uuid)" :disabled="scope.row.excluded"><el-icon><Delete /></el-icon> 删除</el-button>
                                        <el-button type="primary" size="small" @click="deleteOthers(props.row.id, scope.row.uuid)" :disabled="scope.row.excluded"><el-icon><Select /></el-icon> 保留此文件</el-button>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>
                    </template>
                </el-table-column>

                <el-table-column label="组名 (主要文件名)" prop="primary_name" min-width="300"></el-table-column>
                <el-table-column label="包含文件数" width="100">
                    <template #default="scope"><span v-text="scope.row.files.length"></span></template>
                </el-table-column>
                <el-table-column label="总大小 (MB)" prop="total_size" sortable width="150">
                     <template #default="scope">
                        <span v-text="(scope.row.total_size / 1024 / 1024).toFixed(2)"></span>
                    </template>
                </el-table-column>
                <el-table-column label="状态" width="120">
                    <template #default="scope">
                         <el-tag v-if="scope.row.status === 'confirmed'" type="success">确定重复</el-tag>
                         <el-tag v-else-if="scope.row.status === 'content_mismatch'" type="danger">内容不同</el-tag>
                         <el-tag v-else type="warning">疑似重复</el-tag>
                    </template>
                </el-table-column>
            </el-table>
        </div>

        <!-- 5. 确定重复列表 -->
        <div class="section-card" v-show="confirmedGroups.length > 0">
            <div class="section-title">
                <span><el-icon><Check /></el-icon> 确定重复分组 (<span v-text="confirmedGroups.length"></span> 组)</span>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <el-tag size="small" type="info">已展开 <span v-text="expandedConfirmedCount"></span>/<span v-text="confirmedGroups.length"></span></el-tag>
                    <el-button-group>
                        <el-button size="small" :disabled="confirmedGroups.length === 0" @click="expandAllConfirmedGroups">

        <!-- 画质对比结果对话框 -->
        <el-dialog v-model="compareDialogVisible" title="画质对比结果" width="760px" top="8vh">
            <div v-if="compareResult">

                <template v-else>
                    <el-descriptions :column="1" border size="small">

                        </el-descriptions-item>

                            <span v-text="compareResult.result.comparison.metric + ' = ' + metricValue"></span>

                            <span v-text="compareResult.result.elapsed_s"></span>

                    </el-descriptions>
                    <el-alert v-if="alignMode === 'content'" type="info" :closable="false" show-icon style="margin-top: 12px;"
                              :title="'采样已按内容对齐（音频锚点 ' + ((compareResult.result.alignment.anchors || []).length) + ' 个，时长差 ' + (compareResult.result.alignment.duration_diff_pct || '') + '%），可对比不同剪辑版本'"></el-alert>
                    <el-alert v-else-if="alignMode === 'proportional'" type="info" :closable="false" show-icon style="margin-top: 12px;"
                              :title="'采样已按比例对齐（时长差 ' + (compareResult.result.alignment.duration_diff_pct || '') + '%），按同内容不同速度版本处理（如 PAL 提速）'"></el-alert>
                    <el-alert v-else-if="compareResult.align_warning" type="warning" title="两文件时长差超过 0.5%，采样点可能未对齐到同一画面，分数仅供参考" :closable="false" show-icon style="margin-top: 12px;"></el-alert>
                    <div style="margin-top: 12px;" v-if="compareResult.result.verdict && compareResult.result.verdict.reasons && compareResult.result.verdict.reasons.length">
                        <div style="font-weight: 600; margin-bottom: 6px;">判定理由:</div>
                        <ul style="margin: 0; padding-left: 20px;">
                            <li v-for="(r, i) in compareResult.result.verdict.reasons" :key="i" v-text="r"></li>
                        </ul>
                    </div>
                    <div style="margin-top: 16px; text-align: right;" v-if="preferredUuid && otherUuid">
                        <el-button type="danger" @click="deleteFile(otherUuid); compareDialogVisible = false;">
                            保留 <span v-text="preferredName"></span>，删除另一个（移入回收站）
                        </el-button>

    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

        const app = createApp({
            setup() {
                const files = ref([]);
                const filteredFiles = ref([]); // Separate state for filtered result
                const fileSelection = ref([]); // Main table selection
                const groups = ref([]);
                const versionGroups = ref([]);
                const compareResult = ref(null);
                const compareDialogVisible = ref(false);
                let comparePending = false;
                const isBusy = ref(false);
                const groupSelections = ref({});
                const selectedSuspectedGroupIds = ref([]);
                const expandedSuspectedGroupIds = ref([]);
                const expandedConfirmedGroupIds = ref([]);
                const keepSuspectedExpandedAll = ref(false);
                const keepConfirmedExpandedAll = ref(false);
                const nestedTableRefs = ref({});
                const suspectedGroupsTableRef = ref(null);
                
                const config = ref({
                    paths: 'D:\\Movies',
                    extensions: '.mkv, .mp4, .avi, .mov, .wmv, .flv, .webm, .rmvb, .ts, .mts, .m2ts, .mht, .mhtml',
                    apiKey: '',
                    ignoreHidden: true,
                    ignoreSystem: true
                });
                
                const status = ref({ status: 'idle', progress: 0, message: '', logs: [] });
                
                const filters = ref({
                    path: { mode: 'include', value: '' },
                    filename: { mode: 'include', value: '' },
                    extension: { mode: 'include', value: '' },
                    size: { mode: 'gt', value: 0 },
                    duration: { mode: 'gt', value: 0 },
                    expression: ''
                });

                const currentPage = ref(1);
                const pageSize = ref(50);
                const keepPolicy = ref('keep_largest');
                const clusterThreshold = ref(85);
                const logWindow = ref(null);
                let pollTimer = null;
                const isServeMode = location.protocol !== 'file:';

                // Friendly labels/colors for match reasons shown on file rows
                const REASON_LABELS = {
                    same_file: '同一文件',
                    size_exact: '大小相同',
                    name_fuzzy: '名称相似',
                    alias_match: '别名匹配',
                    id_match: '番号相同',
                    image_hash: '图片相同',
                    image_hash_near: '图片相似',
                    content_match: '内容一致'
                };
                const reasonLabel = (r) => REASON_LABELS[r] || r;
                const reasonTagType = (r) => {
                    if (r === 'same_file') return 'success';
                    if (r === 'alias_match' || r === 'image_hash' || r === 'image_hash_near') return 'warning';
                    return 'info';
                };

                // --- Config Persistence ---
                const loadConfig = () => {
                    const saved = localStorage.getItem('movie_manager_config');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            config.value = { ...config.value, ...parsed };
                        } catch (e) { console.error("Config load error", e); }
                    }
                };

                const saveConfig = () => {
                    localStorage.setItem('movie_manager_config', JSON.stringify(config.value));
                    ElementPlus.ElMessage.success('配置已保存到浏览器');
                };

                const exportConfig = () => {
                    const exportData = {
                        ...config.value,
                        filters: filters.value
                    };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
                    const link = document.createElement('a');
                    link.href = dataStr;
                    link.download = "movie_config.json";
                    link.click();
                };

                const importConfig = (file) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const parsed = JSON.parse(e.target.result);
                            // Separate filters from config if present
                            if (parsed.filters) {
                                filters.value = { ...filters.value, ...parsed.filters };
                                delete parsed.filters;
                            }
                            config.value = { ...config.value, ...parsed };
                            ElementPlus.ElMessage.success('配置导入成功');
                            saveConfig();
                        } catch (err) { ElementPlus.ElMessage.error('无效的配置文件'); }
                    };
                    reader.readAsText(file.raw);
                };

                // --- Filtering Logic (Manual Trigger) ---
                const generateExpression = () => {
                    const f = filters.value;
                    const parts = [];
                    
                    if (f.path.value) {
                        const val = f.path.value.replace(/'/g, "\\'");
                        if (f.path.mode === 'include') parts.push(`(path || '').toLowerCase().includes('${val}'.toLowerCase())`);
                        else parts.push(`!(path || '').toLowerCase().includes('${val}'.toLowerCase())`);
                    }
                    if (f.filename.value) {
                        const val = f.filename.value.replace(/'/g, "\\'");
                        if (f.filename.mode === 'include') parts.push(`(filename || '').toLowerCase().includes('${val}'.toLowerCase())`);
                        else parts.push(`!(filename || '').toLowerCase().includes('${val}'.toLowerCase())`);
                    }
                    if (f.extension.value) {
                        const val = f.extension.value.replace(/'/g, "\\'");
                        if (f.extension.mode === 'include') parts.push(`(extension || '').toLowerCase().includes('${val}'.toLowerCase())`);
                        else parts.push(`!(extension || '').toLowerCase().includes('${val}'.toLowerCase())`);
                    }
                    if (f.size.value > 0) {
                        if (f.size.mode === 'gt') parts.push(`size_mb > ${f.size.value}`);
                        else parts.push(`size_mb < ${f.size.value}`);
                    }
                    if (f.duration.value > 0) {
                        // Duration in minutes
                        if (f.duration.mode === 'gt') parts.push(`(duration/60) > ${f.duration.value}`);
                        else parts.push(`(duration/60) < ${f.duration.value}`);
                    }
                    
                    return parts.join(' && ');
                };

                const applyFilters = () => {
                    // Generate expression from UI if expression box is empty
                    if (!filters.value.expression.trim()) {
                        const generated = generateExpression();
                        if (generated) {
                            filters.value.expression = generated;
                            ElementPlus.ElMessage.info('已根据筛选条件生成高级表达式');
                        }
                    }
                    
                    const f = filters.value;
                    // FIX: Always filter from full 'files' list, not 'filteredFiles'
                    const result = files.value.filter(file => {
                        // 1. Path
                        if (f.path.value) {
                            const match = (file.path || '').toLowerCase().includes(f.path.value.toLowerCase());
                            if (f.path.mode === 'include' && !match) return false;
                            if (f.path.mode === 'exclude' && match) return false;
                        }
                        // 2. Filename
                        if (f.filename.value) {
                            const match = (file.filename || '').toLowerCase().includes(f.filename.value.toLowerCase());
                            if (f.filename.mode === 'include' && !match) return false;
                            if (f.filename.mode === 'exclude' && match) return false;
                        }
                        // 3. Extension
                        if (f.extension.value) {
                            const match = (file.extension || '').toLowerCase().includes(f.extension.value.toLowerCase());
                            if (f.extension.mode === 'include' && !match) return false;
                            if (f.extension.mode === 'exclude' && match) return false;
                        }
                        // 4. Size
                        if (f.size.value > 0) {
                            if (f.size.mode === 'gt' && file.size_mb <= f.size.value) return false;
                            if (f.size.mode === 'lt' && file.size_mb >= f.size.value) return false;
                        }
                        // 5. Duration
                        if (f.duration.value > 0) {
                            const durationMin = (file.duration || 0) / 60;
                            if (f.duration.mode === 'gt' && durationMin <= f.duration.value) return false;
                            if (f.duration.mode === 'lt' && durationMin >= f.duration.value) return false;
                        }
                        // 6. Expression
                        if (f.expression.trim()) {
                            try {
                                const { filename, path, size_mb, duration, extension, id_code } = file;
                                const result = new Function('filename', 'path', 'size_mb', 'duration', 'extension', 'id_code',
                                    `return (${f.expression});`
                                )(filename, path, size_mb, duration, extension, id_code || '');
                                if (!result) return false;
                            } catch(e) { return false; }
                        }
                        return true;
                    });
                    filteredFiles.value = result;
                    currentPage.value = 1; // Reset pagination
                    ElementPlus.ElMessage.success(`筛选完成，共找到 ${result.length} 个文件`);
                };

                // --- Data Fetching with Robust JSON Parsing ---
                const fetchData = async () => {
                    // 1. Try to load from embedded data first (Report Mode)
                    try {
                        const embeddedFiles = document.getElementById('embedded-data-files').textContent;
                        const embeddedGroups = document.getElementById('embedded-data-groups').textContent;
                        
                        if (embeddedFiles.trim() !== 'null') {
                            const filesData = JSON.parse(embeddedFiles);
                            const groupsData = JSON.parse(embeddedGroups);
                            const embeddedVersions = document.getElementById('embedded-data-versions').textContent;
                            const versionsData = embeddedVersions.trim() === 'null' ? [] : JSON.parse(embeddedVersions);

                            if (filesData) {
                                const expandedIds = new Set([...expandedSuspectedGroupIds.value, ...expandedConfirmedGroupIds.value]);
                                files.value = filesData;
                                groups.value = groupsData || [];
                                versionGroups.value = versionsData || [];
                                syncExpandedGroups(expandedIds);
                                if (filteredFiles.value.length === 0 && files.value.length > 0) {
                                    filteredFiles.value = files.value;
                                }
                                await nextTick();
                                restoreSelectionState();
                                return; // Stop here if data loaded from HTML
                            }
                        }
                    } catch (e) {
                        console.log("Embedded data load failed or not present, trying API...");
                    }

                    // 2. Fetch from API (Web Mode)
                    try {
                        const res = await fetch('/api/data');
                        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                        
                        // Use text() then manual cleanup before JSON.parse
                        let text = await res.text();
                        
                        // 1. Remove BOM (Byte Order Mark) if present
                        text = text.replace(/^\uFEFF/, '');
                        
                        // 2. Remove potential invalid chars (control characters and replacement char)
                        // Note: \uFFFD is the replacement char.
                        text = text.replace(/[\u0000-\u001F\uFFFD]+/g, ""); 
                        
                        try {
                            const data = JSON.parse(text);
                            const expandedIds = new Set([...expandedSuspectedGroupIds.value, ...expandedConfirmedGroupIds.value]);
                            files.value = data.files;
                            groups.value = data.groups;
                            versionGroups.value = data.version_groups || [];
                            syncExpandedGroups(expandedIds);
                            
                            // If filteredFiles is empty (first load), init it
                            if (filteredFiles.value.length === 0 && files.value.length > 0) {
                                filteredFiles.value = files.value;
                            }
                            await nextTick();
                            restoreSelectionState();
                        } catch (parseErr) {
                            console.error("JSON Parse Error. Substring around error:", text.substring(0, 100)); 
                            throw parseErr;
                        }
                        
                    } catch (e) {
                        console.error("Fetch data error", e);
                        ElementPlus.ElMessage.error("数据加载失败: " + e.message);
                    }
                };

                // --- Actions ---
                const startScan = async () => {
                    const paths = config.value.paths.split('\n').map(p => p.trim()).filter(p => p);
                    const exts = config.value.extensions.split(',').map(e => e.trim()).filter(e => e);
                    
                    if (paths.length === 0) return ElementPlus.ElMessage.warning('请输入扫描路径');

                    try {
                        const res = await fetch('/api/scan/start', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ 
                                paths: paths, 
                                extensions: exts,
                                ignore_hidden: config.value.ignoreHidden,
                                ignore_system: config.value.ignoreSystem
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            isBusy.value = true;
                            files.value = [];
                            groups.value = [];
                            versionGroups.value = [];
                            filteredFiles.value = [];
                            groupSelections.value = {};
                            currentPage.value = 1;
                            startPolling();
                        } else {
                            ElementPlus.ElMessage.error(data.message);
                        }
                    } catch (e) { ElementPlus.ElMessage.error('无法启动: ' + e); }
                };
                
                const startTMDB = async () => {
                    if (!config.value.apiKey) return ElementPlus.ElMessage.warning('请输入 API Key');
                    // If selecting specific files, send those. 
                    // If no selection but filtering is active (filtered < total), send filtered.
                    // If no selection and no filtering (filtered == total), send null to process ALL on backend.
                    
                    let uuids = null;
                    if (fileSelection.value.length > 0) {
                        uuids = fileSelection.value.map(f => f.uuid);
                    } else if (filteredFiles.value.length < files.value.length) {
                        uuids = filteredFiles.value.map(f => f.uuid);
                    }
                    
                    try {
                        const res = await fetch('/api/tmdb/start', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ api_key: config.value.apiKey, uuids: uuids })
                        });
                        const data = await res.json();
                        if (data.success) { isBusy.value = true; startPolling(); }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { ElementPlus.ElMessage.error(e); }
                };
                
                const startMatching = async () => {
                    let uuids = null;
                    if (fileSelection.value.length > 0) {
                        uuids = fileSelection.value.map(f => f.uuid);
                    } else if (filteredFiles.value.length < files.value.length) {
                        uuids = filteredFiles.value.map(f => f.uuid);
                    }
                    
                    try {
                        const res = await fetch('/api/match/start', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ uuids: uuids })
                        });
                        const data = await res.json();
                        if (data.success) { isBusy.value = true; startPolling(); }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { ElementPlus.ElMessage.error(e); }
                };

                const startVersionClustering = async () => {
                    try {
                        const res = await fetch('/api/version/cluster', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ threshold: clusterThreshold.value })
                        });
                        const data = await res.json();
                        if (data.success) { isBusy.value = true; startPolling(); }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { ElementPlus.ElMessage.error('无法启动: ' + e); }
                };

                const startCompare = async (groupId) => {
                    const selection = selectedInGroup(groupId);
                    if (selection.length !== 2) return ElementPlus.ElMessage.warning('请恰好勾选两个文件');
                    comparePending = true;
                    try {
                        const res = await fetch('/api/compare/start', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ uuids: selection.map(f => f.uuid) })
                        });
                        const data = await res.json();
                        if (data.success) { isBusy.value = true; startPolling(); }
                        else { comparePending = false; ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { comparePending = false; ElementPlus.ElMessage.error(e); }
                };

                const fetchCompareResult = async () => {
                    try {
                        const res = await fetch('/api/compare/result');
                        compareResult.value = await res.json();
                        compareDialogVisible.value = true;
                    } catch (e) { console.error('Compare result fetch error', e); }
                };

                const startDeepVerify = async (groupId) => {
                    // ... (existing)
                    // We can reuse the batch endpoint or existing one.
                    // Let's use the list endpoint
                    try {
                        const res = await fetch('/api/match/deep', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ group_ids: [groupId] })
                        });
                        const data = await res.json();
                        if (data.success) { isBusy.value = true; startPolling(); }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { ElementPlus.ElMessage.error(e); }
                };

                const batchVerifySelected = async () => {
                    if (selectedSuspectedGroupIds.value.length === 0) return;
                    const groupIds = [...selectedSuspectedGroupIds.value];
                    try {
                        const res = await fetch('/api/match/deep', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ group_ids: groupIds })
                        });
                        const data = await res.json();
                        if (data.success) { 
                            isBusy.value = true; 
                            startPolling(); 
                            selectedSuspectedGroupIds.value = [];
                        }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { ElementPlus.ElMessage.error(e); }
                };

                const stopScan = async () => { await fetch('/api/scan/stop', { method: 'POST' }); };

                // ... (Delete functions similar to before)
                const deleteFile = async (uuid) => {
                    try {
                        await ElementPlus.ElMessageBox.confirm('确定要删除吗?', '警告', { confirmButtonText: '删除', cancelButtonText: '取消', type: 'warning' });
                        const res = await fetch('/api/file/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ uuid: uuid }) });
                        const data = await res.json();
                        if (data.success) { ElementPlus.ElMessage.success('已删除'); fetchData(); }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { if(e!=='cancel') console.error(e); }
                };

                const deleteOthers = async (groupId, keepUuid) => {
                    try {
                        await ElementPlus.ElMessageBox.confirm('确定要保留此文件并删除其它吗?', '危险', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'error' });
                        const res = await fetch('/api/group/delete_others', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ group_id: groupId, keep_uuid: keepUuid }) });
                        const data = await res.json();
                        if (data.success) { ElementPlus.ElMessage.success('操作成功'); fetchData(); }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { if(e!=='cancel') console.error(e); }
                };
                
                const batchDelete = async (groupId) => {
                    const selection = selectedInGroup(groupId);
                    if (!selection || selection.length === 0) return;
                    try {
                        await ElementPlus.ElMessageBox.confirm(`删除选中的 ${selection.length} 个文件?`, '警告', { confirmButtonText: '删除', cancelButtonText: '取消', type: 'warning' });
                        const uuids = selection.map(f => f.uuid);
                        const res = await fetch('/api/files/batch_delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ uuids: uuids }) });
                        const data = await res.json();
                        if (data.success) { ElementPlus.ElMessage.success('批量删除成功'); fetchData(); groupSelections.value[groupId] = []; }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { if(e!=='cancel') console.error(e); }
                };

                const batchExclude = async (groupId) => {
                    const selection = selectedInGroup(groupId);
                    if (!selection || selection.length === 0) return;
                    try {
                        await ElementPlus.ElMessageBox.confirm(`排除选中的 ${selection.length} 个文件? 以后将不再提示重复。`, '提示', { confirmButtonText: '排除', cancelButtonText: '取消', type: 'info' });
                        const uuids = selection.map(f => f.uuid);
                        const res = await fetch('/api/files/batch_exclude', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ uuids: uuids }) });
                        const data = await res.json();
                        if (data.success) { ElementPlus.ElMessage.success('操作成功'); fetchData(); groupSelections.value[groupId] = []; }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { if(e!=='cancel') console.error(e); }
                };

                const tableRowClassName = ({ row, rowIndex }) => {
                    if (row.excluded) {
                        return 'excluded-row';
                    }
                    return '';
                };

                const normalizeIds = (ids) => Array.from(new Set((ids || []).map(id => String(id))));
                const syncExpandedGroups = (expandedIds) => {
                    const ids = normalizeIds(Array.from(expandedIds || []));
                    const suspectedIds = normalizeIds(suspectedGroups.value.map(g => g.id));
                    const confirmedIds = normalizeIds(confirmedGroups.value.map(g => g.id));
                    if (keepSuspectedExpandedAll.value) {
                        expandedSuspectedGroupIds.value = suspectedIds;
                    } else {
                        const suspectedIdSet = new Set(suspectedIds);
                        expandedSuspectedGroupIds.value = ids.filter(id => suspectedIdSet.has(id));
                    }
                    if (keepConfirmedExpandedAll.value) {
                        expandedConfirmedGroupIds.value = confirmedIds;
                    } else {
                        const confirmedIdSet = new Set(confirmedIds);
                        expandedConfirmedGroupIds.value = ids.filter(id => confirmedIdSet.has(id));
                    }
                };
                const setNestedTableRef = (groupId, el) => {
                    if (!groupId) return;
                    if (el) {
                        nestedTableRefs.value[groupId] = el;
                        return;
                    }
                    delete nestedTableRefs.value[groupId];
                };
                const restoreSelectionState = () => {
                    groups.value.concat(versionGroups.value).forEach(group => {
                        const tableRef = nestedTableRefs.value[group.id];
                        if (!tableRef || typeof tableRef.clearSelection !== 'function') return;
                        const selectedUuids = new Set(groupSelections.value[group.id] || []);
                        tableRef.clearSelection();
                        group.files.forEach(file => {
                            if (selectedUuids.has(file.uuid)) {
                                tableRef.toggleRowSelection(file, true);
                            }
                        });
                    });
                    if (suspectedGroupsTableRef.value && typeof suspectedGroupsTableRef.value.clearSelection === 'function') {
                        const selectedGroupIds = new Set(selectedSuspectedGroupIds.value);
                        suspectedGroupsTableRef.value.clearSelection();
                        suspectedGroups.value.forEach(group => {
                            if (selectedGroupIds.has(String(group.id))) {
                                suspectedGroupsTableRef.value.toggleRowSelection(group, true);
                            }
                        });
                    }
                };
                const handleSelectionChange = (groupId, selection) => {
                    groupSelections.value[groupId] = normalizeIds(selection.map(item => item.uuid));
                };
                const selectedInGroup = (groupId) => {
                    const group = groups.value.find(item => item.id === groupId)
                        || versionGroups.value.find(item => item.id === groupId);
                    if (!group) return [];
                    const selectedUuids = new Set(groupSelections.value[groupId] || []);
                    return group.files.filter(file => selectedUuids.has(file.uuid));
                };
                const handleFileSelection = (val) => { fileSelection.value = val; };
                const handleSuspectedSelectionChange = (val) => {
                    selectedSuspectedGroupIds.value = normalizeIds(val.map(item => item.id));
                };
                const handleSuspectedExpandChange = (row, expandedRows) => {
                    const expandedIds = normalizeIds((expandedRows || []).map(item => item.id));
                    expandedSuspectedGroupIds.value = expandedIds;
                    const allIds = normalizeIds(suspectedGroups.value.map(item => item.id));
                    keepSuspectedExpandedAll.value = allIds.length > 0 && expandedIds.length === allIds.length;
                };
                const handleConfirmedExpandChange = (row, expandedRows) => {
                    const expandedIds = normalizeIds((expandedRows || []).map(item => item.id));
                    expandedConfirmedGroupIds.value = expandedIds;
                    const allIds = normalizeIds(confirmedGroups.value.map(item => item.id));
                    keepConfirmedExpandedAll.value = allIds.length > 0 && expandedIds.length === allIds.length;
                };
                const expandAllSuspectedGroups = () => {
                    keepSuspectedExpandedAll.value = true;
                    expandedSuspectedGroupIds.value = normalizeIds(suspectedGroups.value.map(item => item.id));
                };
                const collapseAllSuspectedGroups = () => {
                    keepSuspectedExpandedAll.value = false;
                    expandedSuspectedGroupIds.value = [];
                };
                const expandAllConfirmedGroups = () => {
                    keepConfirmedExpandedAll.value = true;
                    expandedConfirmedGroupIds.value = normalizeIds(confirmedGroups.value.map(item => item.id));
                };
                const collapseAllConfirmedGroups = () => {
                    keepConfirmedExpandedAll.value = false;
                    expandedConfirmedGroupIds.value = [];
                };

                // --- Helpers ---
                const startPolling = () => {
                    if (pollTimer) clearInterval(pollTimer);
                    pollTimer = setInterval(async () => {
                        try {
                            const res = await fetch('/api/scan/status');
                            if (!res.ok) throw new Error(`Status check failed: ${res.status}`);
                            
                            const text = await res.text();
                            const cleaned = text.replace(/^\uFEFF/, '').replace(/[\u0000-\u001F\uFFFD]+/g, "");
                    try {
                        const data = JSON.parse(cleaned);
                        if (data) {
                            status.value = data;
                            await nextTick();
                            if (logWindow.value) logWindow.value.scrollTop = logWindow.value.scrollHeight;
                            if (['idle', 'completed', 'scanned', 'error', 'cancelled'].includes(data.status)) {
                                isBusy.value = false;
                                clearInterval(pollTimer);
                                if (data.status !== 'idle') fetchData();
                                if (comparePending) { comparePending = false; fetchCompareResult(); }
                            }
                        }
                    } catch (parseErr) {
                         console.error("Status JSON Parse Error:", parseErr);
                    }
                        } catch (e) { 
                            console.error("Polling error:", e); 
                            // Don't spam UI with polling errors, just log
                        }
                    }, 1000);
                };

                const openFile = async (path) => {
                    if (location.protocol === 'file:') {
                        ElementPlus.ElMessage.warning('静态报告模式不支持打开文件，请使用 Web 服务模式');
                        return;
                    }
                    const res = await fetch('/api/open', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: path }) });
                    if (!res.ok) ElementPlus.ElMessage.error('打开文件失败');
                };
                const revealFile = async (path) => {
                    if (location.protocol === 'file:') {
                        ElementPlus.ElMessage.warning('静态报告模式不支持定位文件，请使用 Web 服务模式');
                        return;
                    }
                    const res = await fetch('/api/reveal', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: path }) });
                    if (!res.ok) ElementPlus.ElMessage.error('定位文件失败');
                };
                const formatDuration = (s) => {
                    if (!s) return '';
                    const h = Math.floor(s / 3600);
                    const rem = s % 3600;
                    const m = Math.floor(rem / 60);
                    const sec = Math.floor(s % 60);
                    return `${h}h ${m}m ${sec}s`;
                };
                const progressStatus = computed(function() {
                    if (!status.value) return '';
                    if (status.value.status === 'error') return 'exception';
                    if (['completed', 'scanned'].includes(status.value.status)) return 'success';
                    return '';
                });
                
                const pagedFiles = computed(function() {
                    const start = (currentPage.value - 1) * pageSize.value;
                    const end = start + pageSize.value;
                    return filteredFiles.value.slice(start, end);
                });
                
                const globalSelectedUuids = computed(function() {
                    let uuids = [];
                    groups.value.forEach(g => {
                        const selection = groupSelections.value[g.id];
                        if (selection && selection.length > 0) {
                            uuids.push(...selection);
                        }
                    });
                    return normalizeIds(uuids);
                });

                const globalBatchDelete = async () => {
                    const uuids = globalSelectedUuids.value;
                    if (uuids.length === 0) return;
                    try {
                        await ElementPlus.ElMessageBox.confirm(`确定要全局删除跨组选中的 ${uuids.length} 个文件吗?`, '警告', { confirmButtonText: '删除', cancelButtonText: '取消', type: 'warning' });
                        const res = await fetch('/api/files/batch_delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ uuids: uuids }) });
                        const data = await res.json();
                        if (data.success) { 
                            ElementPlus.ElMessage.success('批量删除成功'); 
                            fetchData(); 
                        }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { if(e!=='cancel') console.error(e); }
                };

                const cleanupConfirmed = async () => {
                    const policyLabels = { keep_largest: '保留最大文件', keep_newest: '保留最新文件', keep_oldest: '保留最早文件' };
                    const label = policyLabels[keepPolicy.value] || keepPolicy.value;
                    try {
                        await ElementPlus.ElMessageBox.confirm(
                            `将按"${label}"策略清理全部 ${confirmedGroups.value.length} 个确认重复组（其余文件移入回收站），是否继续？`,
                            '危险操作', { confirmButtonText: '清理', cancelButtonText: '取消', type: 'warning' });
                        const res = await fetch('/api/cleanup/confirmed', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ policy: keepPolicy.value })
                        });
                        const data = await res.json();
                        if (data.success) { ElementPlus.ElMessage.success(data.message); fetchData(); }
                        else { ElementPlus.ElMessage.error(data.message); }
                    } catch (e) { if (e !== 'cancel') console.error(e); }
                };

                const confirmedGroups = computed( () => {
                    return groups.value.filter(g => g.status === 'confirmed');
                });

                const CONFIDENCE_ZH = { high: '高', medium: '中', low: '低' };
                const confidenceText = computed(() => {
                    const v = compareResult.value && compareResult.value.result && compareResult.value.result.verdict;
                    return v ? (CONFIDENCE_ZH[v.confidence] || v.confidence || '') : '';
                });
                // videodiff verdict.preferred is a file path; map it back to A/B
                const preferredUuid = computed(() => {
                    const cr = compareResult.value;
                    if (!cr || cr.error) return '';
                    const v = (cr.result || {}).verdict || {};
                    if (!v.preferred) return '';
                    const rf = (cr.result || {}).files || [];
                    if (rf.length >= 1 && rf[0].path === v.preferred) return cr.a.uuid;
                    if (rf.length >= 2 && rf[1].path === v.preferred) return cr.b.uuid;
                    return '';
                });
                const otherUuid = computed(() => {
                    const p = preferredUuid.value;
                    const cr = compareResult.value;
                    if (!p || !cr) return '';
                    return p === cr.a.uuid ? cr.b.uuid : cr.a.uuid;
                });
                const alignMode = computed(() => {
                    const a = compareResult.value && compareResult.value.result && compareResult.value.result.alignment;
                    return (a && a.mode) || '';
                });
                const metricValue = computed(() => {
                    const c = compareResult.value && compareResult.value.result && compareResult.value.result.comparison;
                    if (!c) return '';
                    if (c.combined_mean !== undefined && c.combined_mean !== null) return c.combined_mean;
                    if (c.aggregate && c.aggregate.mean !== undefined) return c.aggregate.mean;
                    return '';
                });
                const preferredName = computed(() => {
                    const cr = compareResult.value;
                    if (!cr || !preferredUuid.value) return '';
                    return preferredUuid.value === cr.a.uuid ? cr.a.name : cr.b.name;
                });
                
                const suspectedGroups = computed( () => {
                    return groups.value.filter(g => g.status !== 'confirmed');
                });
                const expandedSuspectedCount = computed(function() {
                    return expandedSuspectedGroupIds.value.length;
                });
                const expandedConfirmedCount = computed(function() {
                    return expandedConfirmedGroupIds.value.length;
                });

                onMounted(function() {
                    loadConfig();
                    startPolling();
                    fetchData();
                });

                return {
                    files, groups, isBusy, config, status, filters,
                    filteredFiles, pagedFiles, currentPage, pageSize, keepPolicy, logWindow, progressStatus,
                    startScan, stopScan, startTMDB, startMatching,
                    openFile, revealFile, formatDuration, deleteFile, deleteOthers,
                    handleSelectionChange, selectedInGroup, batchDelete, batchExclude, handleFileSelection,
                    saveConfig, exportConfig, importConfig, applyFilters, startDeepVerify, tableRowClassName,
                    confirmedGroups, suspectedGroups, selectedSuspectedGroupIds, batchVerifySelected, handleSuspectedSelectionChange,
                    globalSelectedUuids, globalBatchDelete, expandedSuspectedGroupIds, expandedConfirmedGroupIds,
                    handleSuspectedExpandChange, handleConfirmedExpandChange, setNestedTableRef, suspectedGroupsTableRef,
                    expandAllSuspectedGroups, expandAllConfirmedGroups, collapseAllSuspectedGroups, collapseAllConfirmedGroups,
                    expandedSuspectedCount, expandedConfirmedCount,
                    cleanupConfirmed, isServeMode, reasonLabel, reasonTagType,
                    versionGroups, clusterThreshold, startVersionClustering, startCompare,
                    compareResult, compareDialogVisible, preferredName, preferredUuid, otherUuid, confidenceText, metricValue, alignMode
                };
            }
        });
        
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
